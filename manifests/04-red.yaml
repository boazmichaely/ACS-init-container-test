# RED: init container violates a Build/Deploy policy because it MISBEHAVES.
# Image is old/EOL (registry.access.redhat.com/ubi8/nodejs-14:1, unpatched
# since 2023, hundreds of real fixable CVEs incl. Important-severity) AND is
# configured privileged: true with no legitimate reason (unlike Blue, there
# is no operational task here that requires it - it is just an unnecessarily
# over-privileged, unpatched container). This S2I image bakes in a non-root
# user (1001) despite its age, so it won't add a root-user finding on top of
# the CVE/privileged findings. This is the "true positive" case: both the
# image-CVE-based policy and the configuration-based policy should fire, and
# both firings should be considered actionable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: red-app
  namespace: acs-init-container-test
  labels:
    app: red-app
    acs-eap-test: init-container
    container-type-demo: red
spec:
  replicas: 1
  selector:
    matchLabels:
      app: red-app
  template:
    metadata:
      labels:
        app: red-app
        acs-eap-test: init-container
        container-type-demo: red
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: red-init
          image: registry.access.redhat.com/ubi8/nodejs-14:1
          command:
            - sh
            - -c
            - |
              echo 'red-init: unpatched image with known CVEs, running privileged with no legitimate justification'
              exit 0
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: main
          # registry.k8s.io/pause is just a keep-alive placeholder, not part
          # of the init container story - see clean-app for why it was
          # chosen (pinned tag, non-root baked-in user, no CVEs/package
          # manager; the one accepted tradeoff is "90-Day Image Age").
          # Its baked-in user (65535) already satisfies runAsNonRoot without
          # needing an explicit runAsUser override, even under the
          # "privileged" SCC (RunAsAny) that red-init above requires.
          image: registry.k8s.io/pause:3.9
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
