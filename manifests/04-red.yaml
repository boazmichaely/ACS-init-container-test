# RED: init container violates a Build/Deploy policy because it MISBEHAVES.
# Image is old/EOL (docker.io/library/alpine:3.9, unpatched since ~2020,
# real known CVEs) AND is configured privileged: true with no legitimate
# reason (unlike Blue, there is no operational task here that requires it -
# it is just an unnecessarily over-privileged, unpatched container). This is
# the "true positive" case: both the image-CVE-based policy and the
# configuration-based policy should fire, and both firings should be
# considered actionable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: red-app
  namespace: acs-init-container-test
  labels:
    app: red-app
    acs-eap-test: init-container
    container-type-demo: red
spec:
  replicas: 1
  selector:
    matchLabels:
      app: red-app
  template:
    metadata:
      labels:
        app: red-app
        acs-eap-test: init-container
        container-type-demo: red
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: red-init
          image: docker.io/library/alpine:3.9
          command:
            - sh
            - -c
            - |
              echo 'red-init: unpatched image with known CVEs, running privileged with no legitimate justification'
              exit 0
          securityContext:
            privileged: true
      containers:
        - name: main
          # registry.k8s.io/pause is just a keep-alive placeholder, not part
          # of the init container story - see clean-app for why it was
          # chosen (pinned tag, non-root baked-in user, no CVEs/package
          # manager; the one accepted tradeoff is "90-Day Image Age").
          # Its baked-in user (65535) already satisfies runAsNonRoot without
          # needing an explicit runAsUser override, even under the
          # "privileged" SCC (RunAsAny) that red-init above requires.
          image: registry.k8s.io/pause:3.9
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
