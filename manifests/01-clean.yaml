# CLEAN: init container image has no Critical/Important fixable CVEs, and the
# deployment spec follows security best practice (non-root, no privilege
# escalation, all capabilities dropped). Should NOT show up in Vulnerability
# Management with meaningful findings, and should NOT trigger any Build/Deploy
# policy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-app
  namespace: acs-init-container-test
  labels:
    app: clean-app
    acs-eap-test: init-container
    container-type-demo: clean
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clean-app
  template:
    metadata:
      labels:
        app: clean-app
        acs-eap-test: init-container
        container-type-demo: clean
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: clean-init
          # Google distroless "debug-nonroot": non-root user (65532) baked
          # into the image, zero Critical/Important CVEs (just libc6 +
          # libssl3), and no package manager at all - the busybox shell it
          # ships covers the one-line demo command below.
          image: gcr.io/distroless/base-debian12:debug-nonroot
          command: ["/busybox/sh", "-c", "echo 'clean-init: no fixable CVEs, no policy violations'; exit 0"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: main
          # Placeholder app container (not the init-container story). Same
          # distroless debug-nonroot image as clean-init: non-root, no
          # package manager, no Critical/Important CVEs, and ships busybox
          # so we can define a livenessProbe that actually succeeds
          # (pause:3.9 cannot - it has no /bin/true). Used by the
          # Missing-Liveness-Probe demo policy: this main HAS a probe, so
          # that policy stays quiet here; red-app's main deliberately does
          # not.
          image: gcr.io/distroless/base-debian12:debug-nonroot
          command: ["/busybox/sh", "-c", "exec /busybox/sleep infinity"]
          livenessProbe:
            exec:
              command: ["/busybox/true"]
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
