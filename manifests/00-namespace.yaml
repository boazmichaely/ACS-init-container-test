apiVersion: v1
kind: Namespace
metadata:
  name: acs-init-container-test
  labels:
    app.kubernetes.io/part-of: acs-eap-init-container-test
  annotations:
    # OpenShift auto-syncs the pod-security.kubernetes.io/enforce label to the
    # most permissive SCC granted to service accounts in this namespace. Once
    # setup.sh grants the "privileged" SCC to the default SA (required for the
    # Blue/Red init containers below), this namespace is allowed to run them.
    security.openshift.io/scc.podSecurityLabelSync: "true"
